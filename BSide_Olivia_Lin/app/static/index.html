<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>林离的信箱 · BSide Letters</title>
  <meta name="description" content="复刻自《BSide: Olivia Lin》的书信陪伴功能——人格蒸馏（Personal Distillation）skill 演示。写一封信给她，等一封回信。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238c3b2e'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%23f4efe6' stroke-width='1.5' opacity='.7'/%3E%3Ctext x='32' y='41' font-size='26' text-anchor='middle' fill='%23f4efe6' font-family='Kaiti SC,KaiTi,serif'%3E%E9%9B%A2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="bokeh" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="var(--seal)"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="var(--paper)" stroke-width="1.5" opacity=".75"/>
        <text x="32" y="41" font-size="26" text-anchor="middle" fill="var(--paper)" class="seal-text">離</text>
      </svg>
      <div class="brand-text">
        <span class="brand-name">BSIDE · OLIVIA LIN</span>
        <span class="brand-sub">林离的信箱 · 人格蒸馏复刻</span>
      </div>
    </div>
    <div class="topbar-actions">
      <span id="engine-pill" class="pill"><i class="dot"></i><span id="engine-text">模型探活中…</span></span>
      <label class="switch" title="游戏内每天三封；演示默认放开">
        <input type="checkbox" id="limit-toggle" checked>
        <span class="switch-txt">不限量（演示）</span>
      </label>
      <button id="sound-toggle" class="iconbtn" title="环境音" aria-label="环境音">♪</button>
      <button id="theme-toggle" class="iconbtn" title="昼 / 夜" aria-label="昼夜切换">☾</button>
      <button id="history-toggle" class="iconbtn" title="信件存档" aria-label="信件存档">✉</button>
    </div>
  </header>

  <main class="stage">
    <!-- 左：我的信 -->
    <section class="letter my-card" id="my-card">
      <div class="card-inner">
        <div class="letter-head">
          <div class="letter-to">
            <span class="to-label">致</span>
            <span class="to-name">林离 <em>Olivia Lin</em></span>
          </div>
          <div class="letter-meta"><span id="my-date"></span> <span class="dim" id="my-time"></span></div>
        </div>
        <textarea id="draft" spellcheck="false"
          placeholder="今天想告诉她什么？&#10;工作、睡眠、一场夕阳、一支说不清的曲子……&#10;&#10;（Ctrl / ⌘ + Enter 寄出）"></textarea>
        <div class="letter-foot">
          <div class="foot-left">
            <span id="char-count">0 字</span>
            <span class="sep">·</span>
            <span id="day-counter">今日 0 / 3</span>
          </div>
          <div class="foot-right">
            <button id="inspire-btn" class="ghostbtn" title="来一点灵感">灵感</button>
            <button id="print-btn" class="ghostbtn" title="打印她的回信">打印</button>
            <button id="send-btn" class="sendbtn" title="Ctrl/⌘ + Enter">
              <span class="send-seal" aria-hidden="true">
                <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="currentColor"/><circle cx="32" cy="32" r="24" fill="none" stroke="var(--paper)" stroke-width="2" opacity=".8"/><text x="32" y="41" font-size="24" text-anchor="middle" fill="var(--paper)" class="seal-text">離</text></svg>
              </span>
              <span class="send-label">封缄寄出</span>
            </button>
          </div>
        </div>
      </div>
      <div class="wax-seal" id="wax-seal" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M32 2c7 0 9 5 15 7s13 1 14 8-3 9-2 15 5 9 1 15-10 4-14 9-3 12-10 13-9-4-15-6-13 0-16-6 2-10 0-16-7-7-6-14 8-7 11-12 5-13 12-13z" fill="var(--seal)" opacity=".94"/>
          <circle cx="32" cy="32" r="22" fill="none" stroke="var(--paper)" stroke-width="1.6" opacity=".8"/>
          <text x="32" y="41" font-size="24" text-anchor="middle" fill="var(--paper)" class="seal-text">離</text>
        </svg>
      </div>
    </section>

    <!-- 右：她的回信 -->
    <section class="letter her-card" id="her-card">
      <canvas id="rain" class="rain-canvas" aria-hidden="true"></canvas>
      <div class="card-inner">
        <div class="letter-head her-head">
          <div class="her-id">
            <svg class="her-seal" viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="32" r="30" fill="var(--seal)"/>
              <circle cx="32" cy="32" r="24" fill="none" stroke="var(--paper)" stroke-width="1.5" opacity=".75"/>
              <text x="32" y="41" font-size="26" text-anchor="middle" fill="var(--paper)" class="seal-text">離</text>
            </svg>
            <div class="her-name">
              <span class="cn">林离</span>
              <span class="en">Olivia Lin</span>
            </div>
          </div>
          <div class="letter-meta her-meta">
            <span id="her-date"></span>
            <span id="weather-chip" class="weather-chip" hidden><i></i><span id="weather-text"></span></span>
            <span id="mood-chip" class="mood-chip" hidden></span>
          </div>
        </div>
        <div class="letter-body" id="her-body"></div>
        <div class="keys" id="keys" hidden aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="reading" id="reading" hidden><span id="reading-text">林离正在读你的信……</span></div>
      </div>
    </section>
  </main>

  <footer class="footnote">
    <span>复刻自《BSide: Olivia Lin》（米哈游 · 稻海桑田工作室，2026-08-11 停止运营）· 书信功能的人格蒸馏（Personal Distillation）skill 演示</span>
    <span class="dim">角色 IP 归属米哈游；本项目为个人非商业纪念性质</span>
  </footer>

  <!-- 信件存档抽屉 -->
  <aside id="history-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>信件存档 <button id="history-clear" class="ghostbtn sm">清空</button></h2>
      <button id="history-close" class="iconbtn" aria-label="关闭">×</button>
    </div>
    <ul id="history-list"></ul>
    <p id="history-empty" class="history-empty">还没有信件。写第一封吧。</p>
  </aside>

  <!-- 飞行信封 -->
  <svg id="envelope" class="envelope" viewBox="0 0 120 84" aria-hidden="true">
    <rect x="4" y="10" width="112" height="64" rx="6" fill="var(--paper)" stroke="var(--line)" stroke-width="2"/>
    <path d="M8 14 L60 52 L112 14" fill="none" stroke="var(--line)" stroke-width="2"/>
    <circle cx="60" cy="40" r="9" fill="var(--seal)"/>
    <text x="60" y="44" font-size="10" text-anchor="middle" fill="var(--paper)" class="seal-text">離</text>
  </svg>

  <div id="toast" class="toast" role="status"></div>

  <script src="/js/app.js"></script>
</body>
</html>
