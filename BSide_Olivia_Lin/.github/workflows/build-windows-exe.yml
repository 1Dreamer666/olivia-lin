name: build-windows-exe

# 手动触发：Actions → "build-windows-exe" → Run workflow
# 也可以在 PR / push 时跑（注释里给出示意，按需打开）。
on:
  workflow_dispatch:
  # push:
  #   branches: [arena/**]
  #   paths:
  #     - "app/**"
  #     - "skill/**"
  #     - "persona/**"
  #     - "samples/**"
  #     - "config.json"
  #     - "build/olivia.spec"
  #     - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -U pyinstaller google-generativeai

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller build/olivia.spec --noconfirm --clean
          if (-not (Test-Path "dist/OliviaLetterBox/OliviaLetterBox.exe")) {
            Write-Error "PyInstaller 产物不存在：dist/OliviaLetterBox/OliviaLetterBox.exe"
            exit 1
          }
          Get-ChildItem -Recurse dist/OliviaLetterBox | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("Built payload size: {0:N1} MB" -f ($_.Sum / 1MB)) }

      - name: Package release zip
        shell: pwsh
        run: |
          if (Test-Path OliviaLetterBox-win-x64.zip) { Remove-Item OliviaLetterBox-win-x64.zip }
          Compress-Archive -Path dist/OliviaLetterBox -DestinationPath OliviaLetterBox-win-x64.zip -CompressionLevel Optimal
          Get-Item OliviaLetterBox-win-x64.zip | ForEach-Object {
            Write-Host ("Zip size: {0:N2} MB" -f ($_.Length / 1MB))
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OliviaLetterBox-win-x64
          path: OliviaLetterBox-win-x64.zip
          if-no-files-found: error
